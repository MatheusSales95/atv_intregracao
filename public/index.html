<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de pessoas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topo">
      <h1>Cadastro de pessoas</h1>
      <p class="contador" id="contador" aria-live="polite"></p>
    </header>

    <main class="grade">
      <section class="ficha" aria-labelledby="titulo-ficha">
        <h2 id="titulo-ficha">Nova pessoa</h2>

        <form id="formulario" novalidate>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input
              id="cpf"
              name="cpf"
              inputmode="numeric"
              autocomplete="off"
              placeholder="000.000.000-00"
              maxlength="14"
              aria-describedby="erro-cpf"
              required
            />
            <p class="erro" id="erro-cpf"></p>
          </div>

          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="name" maxlength="100" aria-describedby="erro-nome" required />
            <p class="erro" id="erro-nome"></p>
          </div>

          <div class="campo">
            <label for="dataNascimento">Data de nascimento</label>
            <input
              id="dataNascimento"
              name="dataNascimento"
              type="date"
              min="1900-01-01"
              aria-describedby="erro-dataNascimento"
              required
            />
            <p class="erro" id="erro-dataNascimento"></p>
          </div>

          <div class="acoes">
            <button type="submit" id="botao-salvar">Cadastrar pessoa</button>
            <button type="button" id="botao-cancelar" class="secundario" hidden>Cancelar edição</button>
          </div>
        </form>

        <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
      </section>

      <section class="registros" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Pessoas cadastradas</h2>
        <ul class="lista" id="lista"></ul>
        <p class="vazio" id="vazio" hidden>
          Ninguém cadastrado ainda. Preencha a ficha ao lado para cadastrar a primeira pessoa.
        </p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
